# L'API des données, sur le même VPS que le site, sans aucun port publié : seul le site la joint,
# par le réseau Docker `pokedex-net` (créé une fois : `docker network create pokedex-net`, README),
# à l'adresse `http://data-api:3001`.
# Les volumes portent des données irremplaçables (l'historique des prix) : jamais `down -v`.
# Les journaux de chaque service : 3 fichiers de 10 Mo au plus (`ingest` tourne en boucle).
# Aucun service ne peut gagner de droits en cours de route (`no-new-privileges`), et ils n'en
# gardent aucun (`cap_drop`), sans droits d'administrateur (Dockerfile). Les deux services partagent
# une seule image (`pokedex-data`) et ces réglages (`x-bun`).
x-bun: &bun
  build: .
  image: pokedex-data
  restart: unless-stopped
  # Un vrai processus 1 devant Bun : l'arrêt d'un déploiement lui parvient, sans 10 s d'attente.
  init: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  logging: { options: { max-size: 10m, max-file: '3' } }

services:
  # L'API (`src/index.ts`) : elle lit la base et les images que remplit `ingest`, sans rien
  # télécharger. Ses tokens (`API_TOKENS`) viennent du fichier `.env` du clone (README) : sans eux,
  # docker compose refuse de démarrer. Son état (`docker compose ps`) : sain tant qu'elle répond.
  # Une sonde toutes les 30 s, la première 30 s après le démarrage : le déploiement, qui attend
  # 2 min au plus qu'elle soit saine (`deploy/deploy.sh`), en voit trois ou quatre, et une sonde
  # manquée (les étapes du schéma au démarrage) n'en fait pas échouer un qui se remet.
  api:
    <<: *bun
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3001/v1/health').then(() => process.exit(0), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      API_TOKENS: ${API_TOKENS:?les tokens des clients, dans .env (voir le README)}
    volumes:
      - data:/data
      - images:/images
    networks:
      pokedex-net:
        aliases: [data-api]

  # Les tâches d'ingestion (`src/ingest.ts`) à rythme : les espèces chaque mois, les prix toutes
  # les 6 h (ils changent une fois par jour ; la tâche ne retélécharge que ce qui a changé), la
  # sauvegarde de la base chaque jour. Après un échec, de nouveau 10 min plus tard, puis 20, 40…
  # jusqu'à 6 h. Les autres, à la demande, avec la même image :
  #   docker compose run --rm ingest bun src/ingest.ts cards
  ingest:
    <<: *bun
    command: ['bun', 'src/ingest.ts', '--loop']
    volumes:
      - data:/data
      - images:/images
      - backups:/backups

networks:
  # Partagé avec le site (son `compose.yaml`) : créé une fois, à la main (README).
  pokedex-net:
    external: true

volumes:
  # La base SQLite (`data.db`) et le cache des téléchargements de PokéAPI.
  data:
  # Les images copiées chez nous (2,5 à 3 Go : environ 1,5 Go pour les cartes japonaises, 1 à
  # 1,4 Go pour les françaises) : cartes, logos, icônes, Pokémon.
  images:
  # Les sauvegardes de la base, chaque jour (tâche `backups`) : à copier aussi hors du VPS.
  backups:
